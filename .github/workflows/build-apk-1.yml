name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          # Ищем ваш zip-файл и распаковываем его в текущую папку
          ZIP_PATH=$(find . -name "*.zip" -print -quit)
          if [ -n "$ZIP_PATH" ]; then
            echo "Found zip archive at $ZIP_PATH. Unzipping..."
            unzip -o "$ZIP_PATH" -d .
          else
            echo "No zip archive found, proceeding with repository files."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper if missing
        run: |
          # Ищем папку, где лежит файл build.gradle после распаковки
          BUILD_GRADLE_PATH=$(find . -name build.gradle -print -quit)
          if [ -z "$BUILD_GRADLE_PATH" ]; then
            echo "Error: build.gradle not found in any directory!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found. Generating gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/outputs/apk/release/*.apk"
